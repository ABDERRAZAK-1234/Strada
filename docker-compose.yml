
services:
  api:
    build: .
    container_name: strada-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/strada?replicaSet=rs0
    volumes:
      - ./src:/app/src
      - /app/node_modules
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: strada-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:8
    container_name: strada-mongo-init
    volumes:
      - ./docker/mongo-init.sh:/scripts/mongo-init.sh:ro
    entrypoint: ["bash", "/scripts/mongo-init.sh"]
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo_data:
